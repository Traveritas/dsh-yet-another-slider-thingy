<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>思考强度滑条 · GIF 舞台</title>
    <!-- 直接吃插件真实的样式表：GIF 里的形状 / 材质 / 过渡都是插件本来的 -->
    <link rel="stylesheet" href="../src/style.css" />
    <style>
      /* 宿主令牌的替身：只补滑条用到的那十几枚。 */
      :root {
        --dsw-alias-label-primary: #1f2328;
        --dsw-alias-label-secondary: #4a5158;
        --dsw-alias-label-tertiary: #6b7280;
        --dsw-alias-label-caption: #6b7280;
        --dsw-alias-label-dimmed: #9aa1a8;
        --dsw-alias-state-business-primary: #2f6df6;
        --dsw-alias-brand-primary: #2f6df6;
        --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, 0.05);
        --dsw-alias-border-l1: rgba(0, 0, 0, 0.08);
        --dsw-alias-border-l2: rgba(0, 0, 0, 0.14);
        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-radius-sm: 4px;
        --dsw-radius-md: 6px;
        --dsw-radius-lg: 10px;
        --dsw-elevation-prominent: 0 2px 6px rgba(0, 0, 0, 0.16);
        --dsw-focus-ring-color: #2f6df6;
        --ds-transition-duration: 180ms;
        --ds-transition-duration-fast: 120ms;
        --ds-ease-in-out: cubic-bezier(0.25, 0.1, 0.25, 1);
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 720px;
        height: 400px;
        overflow: hidden;
        background: #f4f1ec;
      }

      body {
        font-family: "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
        color: var(--dsw-alias-label-primary);
      }

      .stage {
        position: relative;
        width: 720px;
        height: 400px;
        overflow: hidden;
        background:
          radial-gradient(110% 90% at 50% -10%, #fffdf9 0%, #f5f1eb 52%, #ebe5dc 100%);
      }

      /* 演示页自己加的说明文字，不复用插件样式。 */
      .demo-caption {
        position: absolute;
        top: 30px;
        left: 0;
        right: 0;
        text-align: center;
        color: #7b7268;
        font-size: 12px;
        letter-spacing: 0.14em;
      }

      .demo-caption strong {
        display: block;
        margin-bottom: 5px;
        color: #3a332c;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .demo-surface {
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 22px 48px rgba(52, 43, 34, 0.12),
          0 2px 6px rgba(52, 43, 34, 0.06),
          inset 0 0 0 1px rgba(52, 43, 34, 0.045);
      }

      /* 预览里的菜单不再 fixed：位置交给舞台。 */
      .demo-surface .dts-menu {
        position: static;
        width: 320px;
        max-width: none;
        max-height: none;
        box-shadow: none;
      }

      .demo-composer {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: 560px;
        padding: 12px 14px 10px;
        border-radius: 16px;
        background: #fff;
        box-shadow:
          0 18px 40px rgba(52, 43, 34, 0.1),
          inset 0 0 0 1px rgba(52, 43, 34, 0.05);
        transform: translateX(-50%);
      }

      .demo-prompt {
        padding: 2px 2px 12px;
        color: #8b8177;
        font-size: 13px;
      }

      .demo-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .demo-send {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: #2f6df6;
        color: #fff;
        font-size: 13px;
      }

      .demo-menu-slot {
        position: absolute;
        left: 50%;
        bottom: 130px;
        transform: translateX(-50%);
      }

      .demo-pair {
        position: absolute;
        top: 126px;
        left: 50%;
        display: flex;
        gap: 20px;
        transform: translateX(-50%);
      }

      .demo-pair > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
      }

      .demo-pair .demo-label {
        color: #6c6258;
        font-size: 11px;
        letter-spacing: 0.12em;
      }

      .demo-center {
        position: absolute;
        top: 92px;
        left: 50%;
        transform: translateX(-50%);
      }

      /* 特效这张放大一点：720 宽里 320 的菜单太小，粒子看不清。 */
      .demo-center--zoom {
        top: 86px;
        transform: translateX(-50%) scale(1.35);
        transform-origin: top center;
      }

      .demo-cursor {
        position: absolute;
        top: 0;
        left: 0;
        width: 16px;
        height: 20px;
        filter: drop-shadow(0 1px 2px rgba(20, 25, 32, 0.28));
        pointer-events: none;
        will-change: transform;
      }

      /* 触发器里的箭头是宿主导出的图标；演示页给它一个尺寸。 */
      .stage .dts-chevron {
        flex: none;
        width: 12px;
        height: 12px;
      }

      /* ── 拇指矩阵：六种组合并排，一张卡里比较形状与大小 ──────────── */
      .demo-thumbs {
        position: absolute;
        top: 104px;
        left: 50%;
        display: grid;
        grid-template-columns: repeat(2, 290px);
        gap: 14px 24px;
        width: 644px;
        padding: 18px 20px 20px;
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 22px 48px rgba(52, 43, 34, 0.12),
          0 2px 6px rgba(52, 43, 34, 0.06),
          inset 0 0 0 1px rgba(52, 43, 34, 0.045);
        transform: translateX(-50%);
      }

      .demo-thumbCell {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 4px 6px 3px;
        border-radius: 9px;
        transition: none;
      }

      .demo-thumbCell--on {
        background: rgba(47, 109, 246, 0.045);
      }

      .demo-thumbTrack {
        display: flex;
        align-items: center;
        height: 44px;
      }

      .demo-thumbTrack .dts-track {
        width: 100%;
      }

      .demo-thumbLabel {
        color: #8b8177;
        font-size: 11px;
        letter-spacing: 0.05em;
      }

      .demo-thumbCell--on .demo-thumbLabel {
        color: #2f6df6;
      }

      /* ── 配色：一块滑条 + 一排色片，当前配色高亮 ────────────────── */
      .demo-paletteStage {
        position: absolute;
        top: 92px;
        left: 50%;
        transform: translateX(-50%);
      }

      .demo-paletteRow {
        position: absolute;
        top: 272px;
        left: 50%;
        display: flex;
        gap: 14px;
        transform: translateX(-50%);
      }

      .demo-palette {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        width: 86px;
      }

      .demo-paletteChip {
        width: 54px;
        height: 32px;
        border-radius: 9px;
        box-shadow:
          inset 0 0 0 1px rgba(52, 43, 34, 0.08),
          0 2px 5px rgba(52, 43, 34, 0.08);
      }

      .demo-palette--on .demo-paletteChip {
        box-shadow:
          0 0 0 2px #fff,
          0 0 0 3px var(--demo-chip-accent, #6f5685),
          0 3px 8px rgba(52, 43, 34, 0.12);
      }

      .demo-paletteName {
        color: #8b8177;
        font-size: 11px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .demo-palette--on .demo-paletteName {
        color: #3a332c;
      }

      /* 位置全部由 renderFrame 算好，别让 CSS 过渡抢时间轴。 */
      .stage .dts-thumb,
      .stage .dts-fill,
      .stage .dts-dot {
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="demo-caption" id="caption"></div>
    </div>
    <script src="../src/pixel-flow.js"></script>
    <script>
      const EFFORTS = ["低", "中", "高", "最高"];
      const LEVELS = EFFORTS.length - 1;
      const STYLES = {
        compact: { pad: 6, trackH: 20, thumbW: 12, thumbH: 12, shape: "square", labels: "ticks", dur: 120, ease: [0.25, 0.1, 0.25, 1] },
        claude: { pad: 14, trackH: 28, thumbW: 24, thumbH: 28, shape: "square", labels: "axis", dur: 280, ease: [0.2, 0, 0, 1] },
        codex: { pad: 16, trackH: 28, thumbW: 32, thumbH: 32, shape: "circle", labels: "ticks", dur: 200, ease: [0.23, 1, 0.32, 1] },
      };
      /* 和座位里的 SLIDER_GEOMETRY 同一份（按外观 × 形状）：「大」只乘拇指与 pad，
         轨道高度不动。拇指矩阵场景按这组值搭；外观 scene 仍用 STYLES 的默认值。 */
      const GEOMETRY = {
        compact: {
          square: { pad: 6, trackH: 20, thumbW: 12, thumbH: 12 },
          circle: { pad: 6, trackH: 20, thumbW: 16, thumbH: 16 },
        },
        claude: {
          square: { pad: 14, trackH: 28, thumbW: 24, thumbH: 28 },
        },
        codex: {
          circle: { pad: 16, trackH: 28, thumbW: 32, thumbH: 32 },
          square: { pad: 16, trackH: 28, thumbW: 32, thumbH: 32 },
        },
      };
      const KNOB_SCALE = { md: 1, lg: 1.2 };
      const shapeOf = (styleId, shape) => shape ?? STYLES[styleId].shape;
      const geometryOf = (styleId, shape, size) => {
        const base = GEOMETRY[styleId][shapeOf(styleId, shape)];
        const scale = KNOB_SCALE[size] ?? 1;
        if (scale === 1) return base;
        return {
          pad: Math.round(base.pad * scale),
          thumbW: Math.round(base.thumbW * scale),
          thumbH: Math.round(base.thumbH * scale),
          trackH: base.trackH,
        };
      };
      /* 和座位里的 THUMB_DISCS 同一份形状数据；只有「圆」走矢量，
         圆角方保留旧版 CSS，所以这里不给 square 条目。 */
      const THUMB_DISCS = {
        compact: {
          circle: { viewBox: "0 0 16 16", strokeWidth: 2, shape: { type: "circle", cx: 8, cy: 8, r: 7 } },
        },
        codex: {
          circle: { viewBox: "0 0 32 32", strokeWidth: 1.5, shape: { type: "circle", cx: 16, cy: 16, r: 15.25 } },
        },
      };
      /* 和座位同一份密度粒子数据：depth 决定远近（尺寸 / 透明度 / 尾长 / 速度）。 */
      const PARTICLES = [
        { top: 4, duration: 3.0, delay: 0, depth: 0.9 },
        { top: 9, duration: 4.3, delay: -0.7, depth: 0.2 },
        { top: 14, duration: 3.6, delay: -1.4, depth: 0.55 },
        { top: 19, duration: 4.6, delay: -2.1, depth: 0.1 },
        { top: 6, duration: 3.9, delay: -0.3, depth: 0.35 },
        { top: 11, duration: 3.2, delay: -1.8, depth: 0.75 },
        { top: 16, duration: 2.8, delay: -1.1, depth: 1 },
        { top: 21, duration: 3.4, delay: -2.5, depth: 0.65 },
      ];
      /* 和座位里的 dustVars() 同一个公式；改一处记得两边一起改。
         尺寸是直径：整体缩到原来的一半。 */
      const dustVars = (depth) => ({
        "--dts-dust-size": (1.1 + 1.2 * depth).toFixed(2) + "px",
        "--dts-dust-alpha": (0.45 + 0.55 * depth).toFixed(2),
        "--dts-dust-tail": (7 + 16 * depth).toFixed(1) + "px",
      });
      const GLYPHS = "01+#×/=:·".repeat(8);

      /* 可暂停的 rAF：像素流光场原本自己按帧走，这里改成由 renderFrame 喂时间。 */
      const rafQueue = new Map();
      let rafSeq = 0;
      window.requestAnimationFrame = (cb) => {
        const id = ++rafSeq;
        rafQueue.set(id, cb);
        return id;
      };
      window.cancelAnimationFrame = (id) => rafQueue.delete(id);
      window.__stepFlow = (now) => {
        const jobs = [...rafQueue.values()];
        rafQueue.clear();
        for (const cb of jobs) cb(now);
      };

      const el = (tag, cls, style) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (style) for (const [k, v] of Object.entries(style)) node.style.setProperty(k, v);
        return node;
      };

      const svgPath = (d, cls) => {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 16 16");
        svg.setAttribute("fill", "none");
        svg.setAttribute("aria-hidden", "true");
        if (cls) svg.setAttribute("class", cls);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.4");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
      };

      /* 矢量拇指：只有「圆」走 SVG；形状可以按场景单独指定（拇指矩阵要用）。 */
      const buildThumb = (styleId, shape) => {
        const knobShape = shapeOf(styleId, shape);
        const disc = THUMB_DISCS[styleId]?.[knobShape];
        const thumb = el("span", "dts-thumb" + (disc ? " dts-thumb--disc" : ""));
        if (!disc) return thumb;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "dts-thumbDisc");
        svg.setAttribute("viewBox", disc.viewBox);
        svg.setAttribute("aria-hidden", "true");
        const node = document.createElementNS("http://www.w3.org/2000/svg", disc.shape.type);
        for (const key of ["cx", "cy", "r", "x", "y", "width", "height", "rx"]) {
          if (disc.shape[key] !== undefined) node.setAttribute(key, disc.shape[key]);
        }
        node.setAttribute("fill", "var(--dts-thumb-color, var(--dsw-alias-bg-base))");
        node.setAttribute("stroke", "var(--dts-thumb-ring-color)");
        node.setAttribute("stroke-width", disc.strokeWidth);
        svg.append(node);
        thumb.append(svg);
        return thumb;
      };

      /* 和座位同一个公式：pad + ratio * (100% - 2pad)。 */
      const position = (ratio) => `calc(var(--dts-pad) + ${ratio} * (100% - var(--dts-pad) * 2))`;

      /* 渐变：和插件默认一样用配色的三枚变量做循环色带（两倍宽、首尾同色）。 */
      const GRADIENT_PALETTE = [
        "var(--dts-fill-color, var(--dsw-alias-state-business-primary))",
        "var(--dts-accent-color, var(--dsw-alias-state-business-primary))",
        "var(--dts-particle-color, var(--dts-accent-color, var(--dsw-alias-state-business-primary)))",
      ];
      const gradientImage = () => {
        const tile = [...GRADIENT_PALETTE, GRADIENT_PALETTE[0]];
        const gaps = 2 * (tile.length - 1);
        const stops = [];
        for (let copy = 0; copy < 2; copy += 1) {
          for (let index = 0; index < tile.length; index += 1) {
            const spot = (copy * (tile.length - 1) + index) / gaps;
            stops.push(`${tile[index]} ${(spot * 100).toFixed(3)}%`);
          }
        }
        return `linear-gradient(90deg, ${stops.join(", ")})`;
      };

      function buildFlow() {
        const flow = el("span", "dts-flow");
        flow.dataset.dtsFx = "flow";
        const canvas = el("canvas", "dts-pixelFlow");
        const sheen = el("span", "dts-flowSheen");
        const soft = el("span", "dts-fxGlowSoft");
        const strong = el("span", "dts-fxGlowStrong");
        const glyph = el("span", "dts-fxGlyph");
        for (const suffix of ["", " dts-fxGlyphRow--b"]) {
          const row = el("span", "dts-fxGlyphRow" + suffix);
          row.textContent = GLYPHS + GLYPHS;
          glyph.append(row);
        }
        const gradient = el("span", "dts-fxGradient", { "background-image": gradientImage() });
        flow.append(canvas, sheen, soft, strong, glyph, gradient);
        PARTICLES.forEach((particle, index) => {
          const path = el("span", "dts-flowPath", {
            "--dts-flow-top": particle.top + "px",
            "--dts-flow-duration": particle.duration + "s",
            "--dts-flow-delay": particle.delay + "s",
            "--dts-fx-i": String(index / PARTICLES.length),
            ...dustVars(particle.depth),
          });
          path.append(el("i"));
          flow.append(path);
        });
        return { flow, canvas };
      }

      function menu(styleId, options) {
        const opts = options || {};
        const style = STYLES[styleId];
        const knobShape = shapeOf(styleId, opts.shape);
        const geo = geometryOf(styleId, knobShape, opts.size);
        const surface = el("div", "demo-surface");
        const root = el("div", "dts-root");
        root.dataset.dtsStyle = styleId;
        const menuNode = el("div", "dts-menu");
        menuNode.dataset.dtsStyle = styleId;
        menuNode.dataset.dtsKnob = knobShape;
        menuNode.setAttribute("role", "menu");

        const cell = el("button", "dts-cell");
        cell.type = "button";
        cell.append(el("span", "dts-cellLabel"));
        cell.firstChild.textContent = "模型";
        const value = el("span", "dts-cellValue");
        value.append(el("span"));
        value.firstChild.textContent = "DeepSeek V4";
        cell.append(value, svgPath("M6 4l4 4-4 4", "dts-cellChevron"));

        const band = el("div", "dts-band");
        const head = el("div", "dts-bandHead");
        const headLabel = el("span", "dts-bandLabel");
        headLabel.textContent = "推理强度";
        const bandValue = el("span", "dts-bandValue");
        head.append(headLabel, bandValue);
        const scale = el("div", "dts-scale", {
          "--dts-track-h": geo.trackH + "px",
          "--dts-thumb-w": geo.thumbW + "px",
          "--dts-thumb-h": geo.thumbH + "px",
          "--dts-pad": geo.pad + "px",
        });
        const track = el("div", "dts-track");
        track.setAttribute("role", "slider");
        track.style.height = geo.trackH + "px";
        const rail = el("span", "dts-rail");
        const fill = el("span", "dts-fill");
        const flow = opts.effects ? buildFlow() : null;
        if (flow) {
          fill.append(flow.flow);
          if (geo.trackH < 24) flow.flow.dataset.dtsFlow = "thin";
        }
        const dots = EFFORTS.map((_, index) =>
          el("span", "dts-dot", { left: position(index / LEVELS) }),
        );
        const thumb = buildThumb(styleId, knobShape);
        track.append(rail, fill, ...dots, thumb);
        scale.append(track);

        const ticks = el("div", "dts-ticks");
        ticks.setAttribute("aria-hidden", "true");
        EFFORTS.forEach((label, index) => {
          const tick = el("button", "dts-tick");
          tick.type = "button";
          tick.textContent = label;
          tick.style.left = position(index / LEVELS);
          ticks.append(tick);
        });
        const axis = el("div", "dts-axis");
        axis.setAttribute("aria-hidden", "true");
        ["Faster", "Smarter"].forEach((label, index) => {
          const span = el("span", "dts-axisLabel");
          span.textContent = label;
          span.style.left = position(index);
          axis.append(span);
        });
        scale.append(ticks, axis);
        ticks.style.display = style.labels === "axis" ? "none" : "";
        axis.style.display = style.labels === "axis" ? "" : "none";
        band.append(head, scale);
        menuNode.append(cell, band);
        root.append(menuNode);
        surface.append(root);
        const dom = { surface, root, menuNode, bandValue, track, fill, thumb, dots, ticks, axis, flow };
        return { styleId, style, dom, ticksMode: style.labels, axisMode: style.labels === "axis" };
      }

      /* 三次贝塞尔求值：和 CSS 的 cubic-bezier 同一套参数。 */
      function bezier([x1, y1, x2, y2]) {
        const cx = 3 * x1;
        const bx = 3 * (x2 - x1) - cx;
        const ax = 1 - cx - bx;
        const cy = 3 * y1;
        const by = 3 * (y2 - y1) - cy;
        const ay = 1 - cy - by;
        const sampleX = (t) => ((ax * t + bx) * t + cx) * t;
        const sampleY = (t) => ((ay * t + by) * t + cy) * t;
        return (p) => {
          let lo = 0;
          let hi = 1;
          for (let i = 0; i < 18; i += 1) {
            const mid = (lo + hi) / 2;
            if (sampleX(mid) < p) lo = mid;
            else hi = mid;
          }
          return sampleY((lo + hi) / 2);
        };
      }

      function applyPosition(entry, ratio) {
        const { fill, thumb } = entry.dom;
        thumb.style.left = position(ratio);
        fill.style.width = position(ratio);
      }

      function applyDiscrete(entry, index) {
        const { dom } = entry;
        dom.bandValue.textContent = EFFORTS[index];
        dom.dots.forEach((dot, i) => dot.classList.toggle("dts-dot--on", i <= index));
        dom.ticks.querySelectorAll(".dts-tick").forEach((tick, i) => tick.classList.toggle("dts-tick--on", i === index));
      }

      /* 逐档的跨档滑动：从当前位置缓到目标刻度，急缓用外观自己的曲线。 */
      function startGlide(entry, toRatio, now) {
        const from = entry.position(now);
        entry.glide = {
          from,
          to: toRatio,
          start: now,
          dur: entry.style.dur,
          ease: bezier(entry.style.ease),
        };
      }

      function currentPosition(entry, now) {
        const glide = entry.glide;
        if (!glide) return entry.rest;
        const p = Math.min(1, Math.max(0, (now - glide.start) / glide.dur));
        return glide.from + (glide.to - glide.from) * glide.ease(p);
      }

      function makeEntry(styleId, options) {
        const built = menu(styleId, options);
        const entry = {
          ...built,
          rest: (options && options.ratio) || 0,
          index: (options && options.index) || 0,
          committed: (options && options.index) || 0,
          glide: null,
          position(now) {
            return currentPosition(this, now);
          },
          setInstantly(ratio, index) {
            this.rest = ratio;
            this.glide = null;
            if (index !== undefined) {
              this.index = index;
              applyDiscrete(this, index);
            }
            applyPosition(this, ratio);
          },
          move(now, ratio, index, mode) {
            if (mode === "smooth") {
              this.rest = ratio;
              this.glide = null;
              applyPosition(this, ratio);
              return;
            }
            if (index !== this.index) {
              this.index = index;
              applyDiscrete(this, index);
              startGlide(this, index / LEVELS, now);
            }
            applyPosition(this, this.position(now));
          },
        };
        entry.setInstantly(entry.rest, entry.index);
        return entry;
      }

      /* 页面里所有 CSS 动画都交给时间轴：暂停 + seek。 */
      let animRate = 2.25;
      function seekAnimations(now) {
        for (const anim of document.getAnimations()) {
          anim.pause();
          anim.currentTime = now * animRate;
        }
      }

      function makeCaption(title, subtitle) {
        const caption = document.getElementById("caption");
        caption.textContent = "";
        if (title) {
          const strong = document.createElement("strong");
          strong.textContent = title;
          caption.append(strong);
        }
        if (subtitle) caption.append(document.createTextNode(subtitle));
        return caption;
      }

      function makeComposer() {
        const card = el("div", "demo-composer");
        const prompt = el("div", "demo-prompt");
        prompt.textContent = "把思考强度拧到刚好的那一档。";
        const tools = el("div", "demo-tools");
        const trigger = el("button", "dts-trigger");
        trigger.type = "button";
        const model = el("span", "dts-triggerLabel");
        model.textContent = "DeepSeek V4";
        const effort = el("span", "dts-triggerEffort");
        effort.textContent = " · 高";
        const chevron = svgPath("M4 6l4 4 4-4", "dts-chevron dts-chevron--open");
        trigger.append(model, effort, chevron);
        const send = el("span", "demo-send");
        send.textContent = "↑";
        tools.append(trigger, send);
        card.append(prompt, tools);
        return card;
      }

      function addCursor() {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("class", "demo-cursor");
        svg.setAttribute("viewBox", "0 0 16 20");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", "M2 2v14.3l4.1-4.1 2.7 6 2.3-1-2.7-5.9h5.5z");
        path.setAttribute("fill", "#252a32");
        path.setAttribute("stroke", "#fff");
        path.setAttribute("stroke-width", "1.2");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        document.getElementById("stage").append(svg);
        return svg;
      }

      function moveCursor(cursor, entry, ratio) {
        const rect = entry.dom.track.getBoundingClientRect();
        const stage = document.getElementById("stage").getBoundingClientRect();
        const pad = entry.style.pad;
        const x = rect.left - stage.left + pad + ratio * (rect.width - pad * 2);
        const y = rect.top - stage.top + rect.height / 2;
        cursor.style.transform = `translate(${x}px, ${y}px)`;
      }

      /* 人和手的位移：慢起慢收，中间快。 */
      function smoothstep(t) {
        const p = Math.min(1, Math.max(0, t));
        return p * p * (3 - 2 * p);
      }

      function pointerRatio(now, start, end, from, to) {
        if (now <= start) return from;
        if (now >= end) return to;
        return from + (to - from) * smoothstep((now - start) / (end - start));
      }

      /* ── 场景 1：三套外观 ─────────────────────────────────────────── */
      function sceneSkins(stage) {
        makeCaption("三套外观 · 紧凑", "形状与材质换，档位与提交路径不换");
        const entry = makeEntry("compact", { ratio: 0 });
        const slot = el("div", "demo-menu-slot");
        slot.append(entry.dom.surface);
        const composer = makeComposer();
        stage.append(slot, composer);
        /* 输入框里的触发器跟菜单的已提交档保持一致，别一个「低」一个「高」。 */
        const effort = composer.querySelector(".dts-triggerEffort");
        const cursor = addCursor();

        const plan = [
          { at: 0, style: "compact", label: "紧凑" },
          { at: 2000, style: "claude", label: "块面" },
          { at: 3400, style: "codex", label: "胶囊" },
        ];
        const scale = (styleId) => {
          const style = STYLES[styleId];
          entry.dom.root.dataset.dtsStyle = styleId;
          entry.dom.menuNode.dataset.dtsStyle = styleId;
          entry.dom.menuNode.dataset.dtsKnob = style.shape;
          const nextThumb = buildThumb(styleId);
          entry.dom.thumb.replaceWith(nextThumb);
          entry.dom.thumb = nextThumb;
          entry.dom.ticks.style.display = style.labels === "axis" ? "none" : "";
          entry.dom.axis.style.display = style.labels === "axis" ? "" : "none";
          entry.dom.track.style.height = style.trackH + "px";
          entry.dom.track.style.setProperty("--dts-track-h", style.trackH + "px");
          entry.dom.track.style.setProperty("--dts-thumb-w", style.thumbW + "px");
          entry.dom.track.style.setProperty("--dts-thumb-h", style.thumbH + "px");
          entry.dom.track.style.setProperty("--dts-pad", style.pad + "px");
          entry.dom.track.parentElement.style.setProperty("--dts-track-h", style.trackH + "px");
          entry.dom.track.parentElement.style.setProperty("--dts-thumb-w", style.thumbW + "px");
          entry.dom.track.parentElement.style.setProperty("--dts-thumb-h", style.thumbH + "px");
          entry.dom.track.parentElement.style.setProperty("--dts-pad", style.pad + "px");
          entry.style = style;
          entry.setInstantly(entry.index / LEVELS, entry.index);
        };
        // 单位：毫秒。0–2s 紧凑拖两档；2–3.4s 块面拖一档；3.4s 起胶囊拖两档。
        return (now) => {
          const current = plan.filter((step) => now >= step.at).at(-1);
          if (current.style !== entry.styleId) {
            entry.styleId = current.style;
            scale(current.style);
            const strong = document.querySelector("#caption strong");
            if (strong) strong.textContent = "三套外观 · " + current.label;
          }
          const drags = [
            { start: 400, end: 1300, from: 0, to: 2 },
            { start: 2250, end: 3000, from: 2, to: 3 },
            { start: 3650, end: 4350, from: 3, to: 1 },
          ];
          let ratio = entry.index / LEVELS;
          let active = null;
          for (const drag of drags) {
            if (now >= drag.start - 120 && now <= drag.end + 220) active = drag;
          }
          if (active) ratio = pointerRatio(now, active.start, active.end, active.from / LEVELS, active.to / LEVELS);
          const index = active ? Math.round(ratio * LEVELS) : entry.index;
          entry.move(now, ratio, index, "step");
          if (effort) effort.textContent = " · " + EFFORTS[entry.index];
          if (active) moveCursor(cursor, entry, ratio);
          cursor.style.opacity = active ? "1" : "0";
          seekAnimations(now);
        };
      }

      /* ── 场景 2：逐档 / 平滑 ───────────────────────────────────────── */
      function sceneDrag(stage) {
        makeCaption("同一次拖动 · 两种手感", "左：每跨一档滑过去　右：逐帧跟手，读数停在已提交档");
        const stepEntry = makeEntry("compact", { ratio: 0 });
        const smoothEntry = makeEntry("compact", { ratio: 0 });
        const pair = el("div", "demo-pair");
        const wrap = (entry, label) => {
          const column = el("div");
          const tag = el("div", "demo-label");
          tag.textContent = label;
          column.append(tag, entry.dom.surface);
          return column;
        };
        pair.append(wrap(stepEntry, "逐档"), wrap(smoothEntry, "平滑"));
        stage.append(pair);
        const stepCursor = addCursor();
        const smoothCursor = addCursor();
        const releaseAt = 2200;

        return (now) => {
          const ratio = pointerRatio(now, 350, 1900, 0, 1);
          const index = Math.round(ratio * LEVELS);
          stepEntry.move(now, ratio, index, "step");

          if (now < releaseAt) {
            smoothEntry.dom.bandValue.textContent = EFFORTS[smoothEntry.committed];
            smoothEntry.dom.dots.forEach((dot, i) => dot.classList.toggle("dts-dot--on", i <= smoothEntry.committed));
            smoothEntry.dom.track.setAttribute("data-dts-follow", "");
            smoothEntry.dom.thumb.style.left = position(ratio);
            smoothEntry.dom.fill.style.width = position(ratio);
            smoothEntry.rest = ratio;
          } else if (!smoothEntry.released) {
            /* 松手：按最近档吸附，读数这时才交给新档。 */
            smoothEntry.released = true;
            smoothEntry.committed = index;
            smoothEntry.glide = {
              from: ratio,
              to: index / LEVELS,
              start: now,
              dur: smoothEntry.style.dur,
              ease: bezier(smoothEntry.style.ease),
            };
            smoothEntry.dom.track.removeAttribute("data-dts-follow");
            applyDiscrete(smoothEntry, index);
          }
          if (smoothEntry.released) applyPosition(smoothEntry, smoothEntry.position(now));

          const active = now >= 350 && now <= 2600;
          stepCursor.style.opacity = active ? "1" : "0";
          smoothCursor.style.opacity = active ? "1" : "0";
          if (now >= 350) {
            moveCursor(stepCursor, stepEntry, ratio);
            moveCursor(smoothCursor, smoothEntry, ratio);
          }
          seekAnimations(now);
        };
      }

      /* ── 场景 3：五套特效 ─────────────────────────────────────────── */
      function sceneEffects(stage) {
        makeCaption("五套特效", "强度跟档位走：越高越亮、越鲜艳、越快");
        const entry = makeEntry("codex", { ratio: 1, index: LEVELS, effects: true });
        const center = el("div", "demo-center demo-center--zoom");
        center.append(entry.dom.surface);
        stage.append(center);
        const field = createPixelFlow(entry.dom.flow.canvas, {
          cell: 5,
          color: () => readCssColor(entry.dom.flow.canvas, ["--dts-flow-color", "--dts-particle-color", "--dts-accent-color"]),
          power: () => 1,
          speed: () => 1,
          reduced: () => false,
        });
        entry.dom.flow.flow.style.setProperty("--dts-power", "1");
        const plan = [
          { from: 0, fx: "flow", label: "流光场" },
          { from: 1080, fx: "dust", label: "密度粒子" },
          { from: 2160, fx: "pulse", label: "心跳" },
          { from: 3240, fx: "glyph", label: "字符点阵" },
          { from: 4320, fx: "gradient", label: "渐变" },
        ];
        return (now) => {
          const current = plan.filter((step) => now >= step.from).at(-1);
          if (entry.fx !== current.fx) {
            entry.fx = current.fx;
            entry.dom.flow.flow.dataset.dtsFx = current.fx;
            if (current.fx === "dust") {
              entry.dom.flow.flow.dataset.dtsTrail = "";
              entry.dom.flow.flow.dataset.dtsTrailLength = "short";
            } else {
              delete entry.dom.flow.flow.dataset.dtsTrail;
              delete entry.dom.flow.flow.dataset.dtsTrailLength;
            }
            const strong = document.querySelector("#caption strong");
            if (strong) strong.textContent = "五套特效 · " + current.label;
          }
          window.__stepFlow(now);
          seekAnimations(now);
        };
      }

      /* ── 场景 4：拇指形状与大小 ─────────────────────────────────────
         六格并排，几何全部来自 GEOMETRY；每格只换形状 / 大小，不换档位。
         当前格子的拇指慢慢推开再退回，说明它们都是真滑条，不是贴图。 */
      function sceneThumbs(stage) {
        makeCaption("拇指形状与大小", "形状 × 外观 × 标准 / 大，六种组合并排");
        const plan = [
          { styleId: "compact", shape: "square", size: "md", label: "紧凑 · 圆角方 · 标准" },
          { styleId: "compact", shape: "circle", size: "lg", label: "紧凑 · 圆 · 大" },
          { styleId: "claude", shape: "square", size: "md", label: "块面 · 圆角方 · 标准" },
          { styleId: "claude", shape: "square", size: "lg", label: "块面 · 圆角方 · 大" },
          { styleId: "codex", shape: "circle", size: "md", label: "胶囊 · 圆 · 标准" },
          { styleId: "codex", shape: "square", size: "lg", label: "胶囊 · 圆角方 · 大" },
        ];
        const card = el("div", "demo-thumbs");
        const cells = plan.map((item) => {
          const geo = geometryOf(item.styleId, item.shape, item.size);
          const cell = el("div", "demo-thumbCell");
          cell.dataset.dtsStyle = item.styleId;
          cell.dataset.dtsKnob = item.shape;
          const holder = el("div", "demo-thumbTrack");
          const track = el("div", "dts-track", {
            "--dts-track-h": geo.trackH + "px",
            "--dts-thumb-w": geo.thumbW + "px",
            "--dts-thumb-h": geo.thumbH + "px",
            "--dts-pad": geo.pad + "px",
          });
          const rail = el("span", "dts-rail");
          const fill = el("span", "dts-fill");
          const dots = EFFORTS.map((_, index) => el("span", "dts-dot", { left: position(index / LEVELS) }));
          const thumb = buildThumb(item.styleId, item.shape);
          track.append(rail, fill, ...dots, thumb);
          holder.append(track);
          const label = el("div", "demo-thumbLabel");
          label.textContent = item.label;
          cell.append(holder, label);
          card.append(cell);
          return { cell, fill, thumb };
        });
        stage.append(card);

        const SLOT = 900;
        return (now) => {
          const active = Math.floor(now / SLOT) % cells.length;
          const lift = Math.sin(Math.PI * ((now % SLOT) / SLOT));
          cells.forEach((cell, index) => {
            const ratio = index === active ? 0.55 + 0.4 * lift : 0.55;
            cell.fill.style.width = position(ratio);
            cell.thumb.style.left = position(ratio);
            cell.cell.classList.toggle("demo-thumbCell--on", index === active);
          });
          const strong = document.querySelector("#caption strong");
          if (strong) strong.textContent = "拇指 · " + plan[active].label;
          seekAnimations(now);
        };
      }

      /* ── 场景 5：四套主题配色 ───────────────────────────────────────
         块面把七个槽都用上，最能把配色讲清楚；色片是同一套浅色值的缩略。
         数值与 src/client.js 的 BUILTIN_PALETTES 对齐，改那边记得回来同步。 */
      function scenePalettes(stage) {
        makeCaption("配色 · 昼雾 · 靛夜", "四套主题配色：七个槽都写死，不依赖主题令牌");
        const palettes = [
          {
            name: "昼雾 · 靛夜",
            light: { fill: "#9d97b0", accent: "#61567d", particle: "#61567d", thumb: "#ffffff", track: "#ebeef1", tick: "#7f8894", text: "#68707b" },
          },
          {
            name: "冷晨",
            light: { fill: "#939fa7", accent: "#4f6370", particle: "#4f6370", thumb: "#ffffff", track: "#edeeee", tick: "#818d92", text: "#657075" },
          },
          {
            name: "暮玫瑰",
            light: { fill: "#ad939a", accent: "#7a4f5c", particle: "#7a4f5c", thumb: "#ffffff", track: "#efecec", tick: "#928381", text: "#776b70" },
          },
          {
            name: "暮紫",
            light: { fill: "#a697b4", accent: "#6f5685", particle: "#6f5685", thumb: "#ffffff", track: "#edecef", tick: "#878192", text: "#6a6073" },
          },
        ];
        const slots = ["fill", "accent", "particle", "thumb", "track", "tick", "text"];
        const entry = makeEntry("claude", { ratio: 0.55, index: 2 });
        applyDiscrete(entry, 2);
        const menuSlot = el("div", "demo-paletteStage");
        menuSlot.append(entry.dom.surface);
        stage.append(menuSlot);

        const row = el("div", "demo-paletteRow");
        const chips = palettes.map((palette) => {
          const item = el("div", "demo-palette");
          const chip = el("div", "demo-paletteChip", {
            "background-image": `linear-gradient(135deg, ${palette.light.fill} 0%, ${palette.light.accent} 58%, ${palette.light.thumb} 100%)`,
            "--demo-chip-accent": palette.light.accent,
          });
          const name = el("div", "demo-paletteName");
          name.textContent = palette.name;
          item.append(chip, name);
          row.append(item);
          return item;
        });
        stage.append(row);

        const SLOT = 1300;
        let active = -1;
        return (now) => {
          const index = Math.floor(now / SLOT) % palettes.length;
          if (index !== active) {
            active = index;
            const palette = palettes[index];
            for (const slot of slots) {
              entry.dom.menuNode.style.setProperty(`--dts-${slot}-color`, palette.light[slot]);
            }
            chips.forEach((chip, chipIndex) => chip.classList.toggle("demo-palette--on", chipIndex === index));
            const strong = document.querySelector("#caption strong");
            if (strong) strong.textContent = "配色 · " + palette.name;
          }
          /* 拇指钉在已提交的「高」上：读数 / 圆点 / 拇指三者对齐，
             这一场只讲颜色，不演拖动。 */
          const ratio = 2 / LEVELS;
          entry.dom.thumb.style.left = position(ratio);
          entry.dom.fill.style.width = position(ratio);
          seekAnimations(now);
        };
      }

      const params = new URLSearchParams(location.search);
      const scenes = {
        skins: sceneSkins,
        drag: sceneDrag,
        effects: sceneEffects,
        thumbs: sceneThumbs,
        palettes: scenePalettes,
      };
      const scene = params.get("scene") || "skins";
      const stage = document.getElementById("stage");
      const render = (scenes[scene] ?? sceneSkins)(stage);

      window.renderFrame = (now) => {
        render(now);
        return true;
      };
      window.__ready = true;
    </script>
  </body>
</html>
